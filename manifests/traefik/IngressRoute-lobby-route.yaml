apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lobby-route
  namespace: microservices
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/lobby.v1.LobbyService`)
      middlewares:
        - name: cors-middleware
        - name: rate-limit-middleware
      priority: 100
      services:
        - name: lobby-service
          port: 8089
          scheme: h2c
