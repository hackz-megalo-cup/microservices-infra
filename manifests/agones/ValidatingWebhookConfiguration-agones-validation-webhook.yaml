apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    app: agones
    chart: agones-1.56.0
    component: controller
    heritage: Helm
    release: agones
  name: agones-validation-webhook
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: 
      service:
        name: agones-controller-service
        namespace: agones-system
        path: /validate
    failurePolicy: Fail
    name: validations.agones.dev
    rules:
      - apiGroups:
          - agones.dev
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - fleets
          - gameservers
          - gameserversets
      - apiGroups:
          - agones.dev
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - fleets
          - gameserversets
      - apiGroups:
          - autoscaling.agones.dev
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - fleetautoscalers
    sideEffects: None
