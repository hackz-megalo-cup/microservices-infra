apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: capture-route
  namespace: microservices
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/capture.v1.CaptureService`)
      middlewares:
        - name: cors-middleware
        - name: rate-limit-middleware
      priority: 100
      services:
        - name: capture-service
          port: 8088
          scheme: h2c
