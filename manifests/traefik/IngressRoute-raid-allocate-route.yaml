apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: raid-allocate-route
  namespace: microservices
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/api/raid`)
      middlewares:
        - name: cors-middleware
        - name: rate-limit-middleware
      priority: 95
      services:
        - name: gateway
          port: 8082
